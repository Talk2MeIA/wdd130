<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Rivers Rafting | Contact Us</title>
    <meta name="description" content="Contact Rapid Rivers Rafting for questions, reservations, and rafting adventure information.">
    <meta name="author" content="Albert Lehi">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rapid Rivers Rafting Company Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <h1>Contact Us</h1>

        <section class="contact-company">
            <div class="contact-information">
                <h2>Rapid Rivers Rafting</h2>
                <address>
                    <p>123 River Road<br>Rexburg, ID 83440</p>
                    <p>Phone: <a href="tel:+12085550199">(208) 555-0199</a></p>
                    <p>Email: <a href="mailto:info@rapidriversrafting.com">info@rapidriversrafting.com</a></p>
                </address>
            </div>

            <div class="contact-map">
                <h2>Find Us</h2>
                <iframe
                    src="https://www.google.com/maps?q=Rexburg%2C%20ID&output=embed"
                    title="Map showing the Rapid Rivers Rafting office in Rexburg, Idaho"
                    loading="lazy">
                </iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="images/rafting65_600.jpg" alt="Alex Morgan, lead river guide, preparing a rafting team">
                <figcaption>Alex Morgan — Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/rafting59_600.jpg" alt="Jordan Lee, safety coordinator, leading a river trip">
                <figcaption>Jordan Lee — Safety Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/rafting58_600.jpg" alt="Taylor Smith, customer experience manager, on a river adventure">
                <figcaption>Taylor Smith — Customer Experience Manager</figcaption>
            </figure>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of your message</legend>
                    <label for="general-inquiry"><input type="radio" id="general-inquiry" name="purpose" value="general-inquiry" required> General Inquiry</label>
                    <label for="reservation-question"><input type="radio" id="reservation-question" name="purpose" value="reservation-question"> Reservation Question</label>
                    <label for="website-suggestion"><input type="radio" id="website-suggestion" name="purpose" value="website-suggestion"> Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rapid Rivers Rafting | Albert Lehi</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
